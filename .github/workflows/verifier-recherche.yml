name: Rechercher des cliniques (pédiatrie, IPS, CLSC)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - verifier-recherche.js
      - data/cliniques/recherches.json

permissions:
  contents: write

concurrency:
  group: verifier-recherche
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lire les fiches trouvées (une recherche à la fois, sauvegardée au fur et à mesure)
        run: |
          git config user.name "salle-attente-collecte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for id in $(node -e 'const c=require("./data/cliniques/recherches.json");console.log(c.recherches.filter(r=>r.actif!==false).map(r=>r.id).join(" "))'); do
            SEULEMENT=$id node verifier-recherche.js || echo "Échec : $id"
            git add data/cliniques/recherches
            if git diff --cached --quiet; then continue; fi
            git commit -m "Recherche de cliniques : $id [skip render]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          done
