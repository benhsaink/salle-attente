name: Rechercher des cliniques (pédiatrie, IPS, CLSC)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - verifier-recherche.js
      - data/cliniques/recherches.json

permissions:
  contents: write

concurrency:
  group: verifier-recherche
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lire les fiches trouvées
        run: node verifier-recherche.js
      - name: Sauvegarder dans le dépôt
        run: |
          git config user.name "salle-attente-collecte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cliniques/recherches
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Recherche de cliniques [skip render]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
