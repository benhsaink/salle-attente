name: Fiches officielles des cliniques

on:
  schedule:
    - cron: "17 9 * * *" # chaque matin vers 5 h (heure du Québec) : l'horaire des 7 prochains jours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/cliniques/liste.json
      - data/cliniques/privees-liste.json
      - repertoire.js
      - lib.js

permissions:
  contents: write

concurrency:
  group: repertoire
  cancel-in-progress: false

jobs:
  fiches:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lire les fiches du Répertoire des ressources
        run: node repertoire.js
      - name: Sauvegarder dans le dépôt
        run: |
          git config user.name "salle-attente-collecte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cliniques
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Fiches officielles des cliniques [skip render]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
