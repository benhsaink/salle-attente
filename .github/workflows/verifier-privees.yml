name: Vérifier les cliniques privées candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/cliniques/privees-candidats*.json
      - verifier-privees.js

permissions:
  contents: write

concurrency:
  group: verifier-privees
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chercher et lire les fiches
        run: node verifier-privees.js
      - name: Sauvegarder dans le dépôt
        run: |
          git config user.name "salle-attente-collecte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cliniques/privees-verifications*.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Vérification des cliniques privées candidates [skip render]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
