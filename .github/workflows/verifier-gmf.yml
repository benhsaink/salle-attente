name: Vérifier les GMF (rendez-vous le jour même)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - verifier-gmf.js

permissions:
  contents: write

concurrency:
  group: verifier-gmf
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lire toutes les fiches GMF
        run: node verifier-gmf.js
      - name: Sauvegarder dans le dépôt
        run: |
          git config user.name "salle-attente-collecte"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cliniques/gmf-verifications.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Vérification des GMF [skip render]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
